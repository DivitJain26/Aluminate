services:
  server:
    build:
      context: ./server
    container_name: aluminate-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        # Must be the HOST-reachable URL — this runs in the user's browser,
        # so "http://server:5000" would NOT resolve
        VITE_API_BASE_URL: http://localhost:5000
    container_name: aluminate-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
